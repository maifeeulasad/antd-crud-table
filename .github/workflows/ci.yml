name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 'Installing build deps'
        run: npm i -g pnpm
      - name: 'Installing deps'
        run: pnpm i
      - name: 'Lint'
        run: pnpm lint
      - name: 'Test'
        run: pnpm test
      - name: 'Build library'
        run: pnpm build:lib
