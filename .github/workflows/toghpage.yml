name: Build and Publish to GH Pages

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: 'Installing build deps'    
      run: npm i -g pnpm@10.25.0
    - name: 'Installing deps'    
      run: pnpm i
    # One tree: the demo at the root, Storybook under /storybook, the
    # TypeDoc reference under /api. The demo builds first because it empties
    # dist-site.
    - name: 'Build site'
      run: pnpm build:site
    - name: 'Deploy'
      uses: peaceiris/actions-gh-pages@v4
      with:
        deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        publish_dir: ./dist-site
        allow_empty_commit: true
